<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mattebox playlist demo</title>
  <link rel="icon" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
  />
  <script>
    // Before the first paint, so the page never flashes the other theme.
    try {
      const theme = localStorage.getItem('mattebox.demo.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <script type="module" crossorigin src="/pr-preview/pr-20/assets/playlist-Dr4HPWMU.js"></script>
  <link rel="modulepreload" crossorigin href="/pr-preview/pr-20/assets/objectSpread2-Cp9FhHJ8.js">
  <link rel="modulepreload" crossorigin href="/pr-preview/pr-20/assets/es2015-BzKaf9Oy.js">
  <link rel="modulepreload" crossorigin href="/pr-preview/pr-20/assets/theme-CFF8IB3F.js">
  <link rel="modulepreload" crossorigin href="/pr-preview/pr-20/assets/src-DP8kVZEu.js">
  <link rel="stylesheet" crossorigin href="/pr-preview/pr-20/assets/theme-p_hauBtW.css">
</head>
<body>
  <header class="masthead">
    <a class="home" href="https://mattebox.ch/"><img class="logo" alt="Mattebox, the website"></a>
    <h1>Mattebox playlist</h1>
    <nav class="pages" aria-label="Demo pages">
      <button type="button" class="pages-toggle" popovertarget="pages-menu" aria-label="The other demo pages">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path fill-rule="evenodd" d="M4 13h24v14H4zM13.5 16v8l6.5-4zM7 8.5h18v2.5h-18zM10 4h12v2.5h-12z" /></svg>
      </button>
      <div id="pages-menu" class="pages-list" popover>
        <a class="page-link" href="./">The element</a>
        <a class="page-link" href="./reels.html">Reels</a>
      </div>
    </nav>
    <button type="button" id="theme-toggle" class="theme-toggle"></button>
  </header>

  <main id="app" class="rig">
    <div class="frame">
      <section aria-label="Player">
        <mattebox-player id="player" controls="custom" autoplay muted>
          <mbx-title></mbx-title>
          <mbx-start-button></mbx-start-button>
          <mbx-marker-button></mbx-marker-button>
          <mbx-error-screen></mbx-error-screen>
          <mbx-spinner></mbx-spinner>
          <mbx-up-next></mbx-up-next>
          <mbx-playlist pause-on-open></mbx-playlist>
          <mbx-control-bar>
            <mbx-current-time></mbx-current-time>
            <mbx-seek-bar></mbx-seek-bar>
            <mbx-duration></mbx-duration>
            <mbx-previous-button></mbx-previous-button>
            <mbx-play-button></mbx-play-button>
            <mbx-next-button></mbx-next-button>
            <mbx-volume></mbx-volume>
            <mbx-spacer></mbx-spacer>
            <mbx-subtitles-menu></mbx-subtitles-menu>
            <mbx-quality-menu></mbx-quality-menu>
            <mbx-playlist-button></mbx-playlist-button>
            <mbx-fullscreen-button></mbx-fullscreen-button>
          </mbx-control-bar>
        </mattebox-player>
        <p id="status" class="status" aria-live="polite"></p>
      </section>
      <section class="flag flag-bottom" aria-labelledby="code-title">
        <div class="flag-head">
          <h2 id="code-title">Markup</h2>
          <button type="button" id="copy-code">Copy</button>
        </div>
        <pre id="code"></pre>
      </section>
    </div>

    <aside class="flag flag-right" aria-labelledby="options-title">
      <div class="flag-head">
        <h2 id="options-title">The playlist</h2>
      </div>

      <label class="field" title="A ready-made list. Each loads from the first item.">
        <span>List</span>
        <select id="sample">
          <option value="films">Open movies: a series with titles, artwork, chapters and credits</option>
          <option value="tracks">Short audio tracks: try repeat one</option>
          <option value="broken">A list with a missing item: skip on error</option>
        </select>
      </label>

      <fieldset class="group">
        <legend>Modes</legend>
        <label class="field" title="none stops at the end of the list, all goes back to the first item, one plays the same item again.">
          <span>Repeat</span>
          <select id="repeat">
            <option value="none">none</option>
            <option value="all">all</option>
            <option value="one">one</option>
          </select>
        </label>
        <div class="checks">
          <label class="check" title="Plays the items in a random order. The list keeps its order."><input type="checkbox" id="shuffle" /><span>Shuffle</span></label>
          <label class="check" title="Plays the next item when one ends."><input type="checkbox" id="autoadvance" checked /><span>Auto-advance</span></label>
          <label class="check" title="Sets autoplay on the player, so the first item plays once it loads. Browsers allow it only when the video starts muted."><input type="checkbox" id="autoplay" checked /><span>Autoplay</span></label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Events</legend>
        <ol id="log" class="log" aria-live="polite"></ol>
      </fieldset>
    </aside>
  </main>
</body>
</html>
