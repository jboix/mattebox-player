<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mattebox player demo</title>
  <link rel="icon" type="image/svg+xml" />
  <script type="module" crossorigin src="/mattebox-player/assets/index-DjOCb7-t.js"></script>
  <link rel="stylesheet" crossorigin href="/mattebox-player/assets/index-Dye0Pkq5.css">
</head>
<body>
  <main id="app">
    <header class="brand">
      <img class="logo" alt="">
      <div>
        <h1>Mattebox <span class="tag">player</span></h1>
        <p class="tagline">Every row loads a source and states which handler won.</p>

    <mattebox-player id="player"></mattebox-player>

    </table>
